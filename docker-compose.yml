
services:
  db:
    image: postgres:latest
    container_name: meu-postgres
    healthcheck:
      test: ["CMD", "pg_isready","-U","postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    env_file:
      - .env
    ports:
      - 5433:5432
    environment:
      POSTGRES_USER: ${usuario:?error}
      POSTGRES_PASSWORD: ${senha_banco:?error}
      POSTGRES_DB: ${database:?error}
    restart: always
    volumes:
      - db_data:/var/lib/postgresql
  pipeline:
    build: .
    depends_on:
        db:
          condition: service_healthy
    environment:
      host: db
      port: 5432
    env_file:
      - .env

volumes:
  db_data:
