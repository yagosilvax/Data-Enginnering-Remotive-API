
services:
  db:
    image: postgres:latest
    container_name: meu-postgres
    env_file:
      - .env
    ports:
      - 5433:5432
    environment:
      POSTGRES_USER: ${usuario:?error}
      POSTGRES_PASSWORD: ${senha_banco:?error}
      POSTGRES_DB: ${database:?error}
    restart: always
    volumes:
      - db_data:/var/lib/postgresql
  pipeline:
    build: .
    depends_on:
      - db
    environment:
      host: db
      port: 5432
    env_file:
      - .env

volumes:
  db_data:
